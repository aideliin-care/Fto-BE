<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>診所文字預約</title>
<style>
  :root { --bg: #f5f5f4; --panel: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
          --me: #0f766e; --me-ink: #fff; --them: #f5f5f4; --ok: #15803d; --warn: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 560px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
         background: var(--panel); border-inline: 1px solid var(--line); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  button { background: var(--me); color: var(--me-ink); border-color: var(--me); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #phone { width: 130px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; }
  .them { background: var(--them); align-self: flex-start; }
  .me { background: var(--me); color: var(--me-ink); align-self: flex-end; }
  .note { align-self: center; color: var(--muted); font-size: 14px; }
  .note.ok { color: var(--ok); } .note.warn { color: var(--warn); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  #text { flex: 1; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .langs button { border: 0; border-radius: 0; background: var(--panel); color: var(--muted); padding: 8px 10px; }
  .langs button[aria-pressed="true"] { background: var(--me); color: var(--me-ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">診所文字預約</h1>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <input id="phone" value="0987000111" aria-label="來電號碼">
    <button id="restart" type="button" data-t="start">開始</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="send">
    <input id="text" placeholder="例如：我肩膀痛，想掛復健科" autocomplete="off" disabled>
    <button disabled data-t="send">送出</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const text = document.getElementById("text");
  const sendButton = document.querySelector("#send button");
  let sessionId = null;

  const STRINGS = {
    zh: { html: "zh-Hant", title: "診所文字預約", start: "開始", send: "送出", phone: "來電號碼",
          placeholder: "例如：我肩膀痛，想掛復健科", caller: "來電號碼", booked: "預約完成，編號",
          done: "對話完成", handoff: "已轉接櫃檯人員", error: "系統錯誤",
          ended: "對話已結束或不存在，請重新開始。", busy: "系統暫時無法服務，請稍後再試。" },
    en: { html: "en", title: "Clinic Booking Chat", start: "Start", send: "Send", phone: "Caller number",
          placeholder: "e.g. My shoulder hurts, I'd like to book a session", caller: "Calling from",
          booked: "Booked, appointment no.", done: "Conversation complete",
          handoff: "Transferred to the front desk", error: "Something went wrong",
          ended: "This conversation has ended. Please start again.",
          busy: "The service is temporarily unavailable. Please try again later." },
  };
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang");
  if (!STRINGS[lang]) {
    try { lang = localStorage.getItem("chat-lang"); } catch { lang = null; }
  }
  if (!STRINGS[lang]) lang = "zh";
  const t = (key) => STRINGS[lang][key];

  function applyLang(next) {
    lang = next;
    try { localStorage.setItem("chat-lang", lang); } catch {}
    document.documentElement.lang = t("html");
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll("[data-lang]").forEach((el) => {
      el.setAttribute("aria-pressed", String(el.dataset.lang === lang));
    });
    document.getElementById("phone").setAttribute("aria-label", t("phone"));
    text.placeholder = t("placeholder");
  }

  function add(cls, content) {
    const div = document.createElement("div");
    div.className = cls;
    div.textContent = content;
    log.append(div);
    log.scrollTop = log.scrollHeight;
  }

  function setOpen(open) {
    text.disabled = sendButton.disabled = !open;
    if (open) text.focus();
  }

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await response.json();
    if (response.status === 404) throw new Error(t("ended"));
    if (response.status === 502) throw new Error(t("busy"));
    if (!response.ok) throw new Error(t("error"));
    return data;
  }

  function handle(data) {
    sessionId = data.session_id;
    add("msg them", data.reply);
    if (data.state === "COMMITTED") {
      add("note ok", data.appointment_id ? `${t("booked")} ${data.appointment_id}` : t("done"));
    } else if (data.state === "HANDOFF") {
      add("note warn", t("handoff"));
    } else {
      setOpen(true);
      return;
    }
    sessionId = null;
    setOpen(false);
  }

  async function start() {
    log.replaceChildren();
    setOpen(false);
    add("note", `${t("caller")} ${document.getElementById("phone").value}`);
    try {
      handle(await post("chat/start", { phone: document.getElementById("phone").value, lang }));
    } catch (error) {
      add("note warn", error.message);
    }
  }

  // Switching language mid-conversation starts over: the agent was set up in
  // the old one and would keep answering in it.
  document.querySelectorAll("[data-lang]").forEach((el) => el.addEventListener("click", () => {
    if (el.dataset.lang === lang) return;
    applyLang(el.dataset.lang);
    if (sessionId) start();
  }));
  applyLang(lang);
  document.getElementById("restart").addEventListener("click", start);
  document.getElementById("send").addEventListener("submit", async (event) => {
    event.preventDefault();
    const said = text.value.trim();
    if (!said || !sessionId) return;
    text.value = "";
    add("msg me", said);
    setOpen(false);
    try {
      handle(await post("chat/message", { session_id: sessionId, text: said }));
    } catch (error) {
      add("note warn", error.message);
      sessionId = null;
    }
  });
</script>
</body>
</html>
